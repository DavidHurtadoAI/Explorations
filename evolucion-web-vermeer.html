 else if(T>=DUR){ip.innerHTML='<path d="M12.5 6.2A5 5 0 1 0 13 10"/><path d="M13 2.8v3.6H9.4"/>';b.title='Repetir';b.setAttribute('aria-label','Repetir');}
 else{ip.innerHTML='<path d="M5 3l8 5-8 5z"/>';b.title='Reproducir (espacio)';b.setAttribute('aria-label','Reproducir');}
 $('iMute').innerHTML=AU.muted?'<path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 6l4 4M15 6l-4 4"/>':'<path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 5.5a3.5 3.5 0 0 1 0 5M13.5 3.5a6 6 0 0 1 0 9"/>';
 $('bMute').setAttribute('aria-label',AU.muted?'Activar sonido':'Silenciar');$('bMute').title=AU.muted?'Activar sonido (M)':'Silenciar (M)';}
function begin(){if(!FONTS_OK)return;audioInit();started=true;if(AU.ctx&&AU.ctx.state!=='running')AU.ctx.resume();restart();}
function play(){if(T>=DUR){restart();return;}playing=true;last=null;if(AU.ctx){AU.ctx.resume().then(()=>{AU.base=AU.ctx.currentTime-T;});AU.base=AU.ctx.currentTime-T;}setIcon();}
function pause(){playing=false;if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend();setIcon();}
function toggle(){if(!started){begin();return;}if(playing)pause();else play();}
function restart(){T=0;idle=0;playing=true;last=null;if(AU.ctx){AU.ctx.resume();resync();}setIcon();}
function seek(t){if(!started)begin();T=clamp(t,0,DUR);idle=0;if(T>=DUR){T=DUR;playing=false;}resync();setIcon();}
function mute(){AU.muted=!AU.muted;if(AU.master)AU.master.gain.setTargetAtTime(AU.muted?0:VOL,AU.ctx.currentTime,.03);setIcon();}
function full(){const el=document.documentElement;if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}}
$('bPlay').onclick=toggle;$('bRestart').onclick=()=>{if(!started)begin();else restart();};$('bFull').onclick=full;$('bMute').onclick=mute;
$('bar').onclick=e=>{const r=$('bar').getBoundingClientRect();seek(clamp((e.clientX-r.left)/r.width,0,1)*DUR);};
view.onclick=toggle;view.ondblclick=full;
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();toggle();}else if(e.key==='r'||e.key==='R'){if(!started)begin();else restart();}else if(e.key==='f'||e.key==='F')full();else if(e.key==='m'||e.key==='M')mute();else if(e.key==='ArrowRight')seek(T+2);else if(e.key==='ArrowLeft')seek(T-2);});
let shown=performance.now();function poke(){shown=performance.now();}
addEventListener('mousemove',poke);addEventListener('touchstart',poke);addEventListener('keydown',poke);
function ui(){$('fill').style.width=(T/DUR*100)+'%';const on=started&&(!playing||performance.now()-shown<2200);$('ui').classList.toggle('on',on);}
setIcon();
Promise.all(FONT_FACES.map(f=>f.load().then(ff=>document.fonts.add(ff)))).then(()=>{FONTS_OK=true;},()=>{FONTS_OK=true;});
window.__seek=(t,vt)=>{started=true;T=t*K;playing=false;render(t,vt===undefined?t*K:vt);};
window.__ready=()=>FONTS_OK;
window.__renderAudio=async(sr,only)=>{sr=sr||22050;const oc=new OfflineAudioContext(2,Math.ceil(sr*(DUR+4)),sr);const A={muted:false};setupGraph(A,oc,oc.destination);
 for(const e of SND){if(only==='mus'&&!e.mus)continue;if(only==='sfx'&&e.mus)continue;playEv(A,e,e.rt+.001);}const b=await oc.startRendering();return b.getChannelData(0);};
requestAnimationFrame(frame);
