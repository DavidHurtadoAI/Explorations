&lt;section class=&quot;wrap&quot; id=&quot;ta-curves&quot;&gt;
 &lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;section-num&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;h2 class=&quot;section-title&quot;&gt;El par explica la reserva.&lt;br&gt;Las rpm explican la potencia.&lt;/h2&gt;&lt;p class=&quot;section-deck&quot;&gt;Explora ambas curvas a la vez. Los puntos de banco proceden de una lectura del gráfico de Cycle World; los máximos oficiales se muestran por separado.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;controls&quot;&gt;&lt;div class=&quot;seg&quot; id=&quot;ta-basis&quot;&gt;&lt;button type=&quot;button&quot; data-basis=&quot;wheel&quot; aria-pressed=&quot;true&quot;&gt;Curvas de banco · rueda&lt;/button&gt;&lt;button type=&quot;button&quot; data-basis=&quot;engine&quot; aria-pressed=&quot;false&quot;&gt;Picos oficiales · motor&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;legend&quot;&gt;&lt;button type=&quot;button&quot; data-bike=&quot;tiger&quot; aria-pressed=&quot;true&quot;&gt;&lt;i class=&quot;swatch&quot;&gt;&lt;/i&gt;Tiger 850 Sport&lt;/button&gt;&lt;button type=&quot;button&quot; data-bike=&quot;trident&quot; aria-pressed=&quot;true&quot;&gt;&lt;i class=&quot;swatch trident-line&quot;&gt;&lt;/i&gt;Trident 660&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;p class=&quot;data-ribbon&quot; id=&quot;ta-curve-origin&quot;&gt;Banco Cycle World / Dynojet 250i · motos 2021 de la misma generación mecánica · curva reconstruida, no medición de las unidades 2024.&lt;/p&gt;
 &lt;div class=&quot;chart-grid&quot;&gt;&lt;div class=&quot;chart-block&quot;&gt;&lt;h3&gt;Par disponible&lt;/h3&gt;&lt;div class=&quot;chart-shell&quot;&gt;&lt;svg id=&quot;ta-torque&quot; class=&quot;plot&quot; role=&quot;img&quot; aria-label=&quot;Curvas de par equivalente referido al régimen del motor, en newton metro&quot;&gt;&lt;/svg&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;chart-block&quot;&gt;&lt;h3&gt;Potencia entregada&lt;/h3&gt;&lt;div class=&quot;chart-shell&quot;&gt;&lt;svg id=&quot;ta-power&quot; class=&quot;plot&quot; role=&quot;img&quot; aria-label=&quot;Curvas de potencia a la rueda en caballos métricos&quot;&gt;&lt;/svg&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;plot-readout&quot; id=&quot;ta-readout&quot; aria-live=&quot;off&quot;&gt;&lt;/div&gt;
 &lt;div class=&quot;tip&quot; id=&quot;ta-tooltip&quot; role=&quot;tooltip&quot; hidden&gt;&lt;/div&gt;
 &lt;p class=&quot;small top-gap&quot;&gt;Pasa el cursor o toca para comparar. Pulsa sobre la curva para llevar ese régimen al simulador. Las líneas discontinuas verticales marcan 4.000, 5.000, 6.000 y 7.000 rpm; la zona ámbar comienza en tu aviso de rodaje.&lt;/p&gt;
 &lt;div class=&quot;insights&quot;&gt;&lt;div class=&quot;insight&quot;&gt;&lt;span class=&quot;big-number&quot;&gt;+28 %&lt;/span&gt;&lt;h3&gt;Más par máximo declarado&lt;/h3&gt;&lt;p&gt;82 frente a 64 Nm. Esa diferencia favorece a la Tiger, aunque el peso y la transmisión cambian cuánto empuje llega al suelo.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;insight&quot;&gt;&lt;span class=&quot;big-number&quot;&gt;+1.750&lt;/span&gt;&lt;h3&gt;rpm para el máximo de potencia&lt;/h3&gt;&lt;p&gt;La Trident llega a su máximo a 10.250 rpm. La Tiger, a 8.500. Dos potencias parecidas se obtienen de formas distintas.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;insight&quot;&gt;&lt;span class=&quot;big-number&quot;&gt;4.000&lt;/span&gt;&lt;h3&gt;No es un interruptor del motor&lt;/h3&gt;&lt;p&gt;A 4.000 rpm, la lectura del banco sitúa a la Trident cerca del 96 % de su par máximo. Lo que aún puede crecer mucho es la potencia: necesitas más vueltas, no que aparezca el par.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;details&gt;&lt;summary&gt;Qué se ha medido y qué se ha reconstruido&lt;/summary&gt;&lt;p&gt;Cycle World midió en 2021: Tiger, 76,93 hp a 8.030 rpm y 54,99 lb·ft a 6.930 rpm; Trident, 72,05 hp a 10.200 rpm y 42,85 lb·ft a 6.660 rpm. Es un mismo tipo de banco, pero son ensayos distintos, no una prueba comparativa simultánea. &lt;a href=&quot;https://www.cycleworld.com/story/bikes/how-much-power-does-the-2021-tiger-850-sport-make/&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Ensayo Tiger&lt;/a&gt; · &lt;a href=&quot;https://www.cycleworld.com/story/bikes/how-much-power-does-the-2021-triumph-trident-660-make/&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Ensayo Trident&lt;/a&gt;.&lt;/p&gt;&lt;p&gt;Las líneas de este reportaje interpolan muestras leídas visualmente de sus gráficos; no son los ficheros originales del banco. Las bandas expresan una tolerancia orientativa de lectura de ±2 Nm, no un intervalo estadístico ni toda la variabilidad entre unidades. Potencia y par se mantienen ligados mediante P = T × rpm / 9.549,3 en kW. No se extrapola fuera del tramo leído.&lt;/p&gt;&lt;p&gt;El par de un gráfico Dynojet, expresado frente a rpm del motor, es un par equivalente tras las pérdidas de transmisión. No es el par ya multiplicado en el eje de la rueda. Los picos al motor de Triumph no se unen con una curva inventada ni se convierten a rueda con un porcentaje fijo.&lt;/p&gt;&lt;/details&gt;
&lt;/section&gt;
&lt;section class=&quot;wrap line&quot; id=&quot;ta-lab&quot;&gt;
 &lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;section-num&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Prueba la diferencia.&lt;/h2&gt;&lt;p class=&quot;section-deck&quot;&gt;Cambia régimen, marcha y carga. Compara a las mismas rpm o a la misma velocidad: el resultado cuenta una historia distinta en cada caso.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;lab&quot;&gt;&lt;div class=&quot;lab-head&quot;&gt;&lt;h3&gt;Laboratorio de empuje&lt;/h3&gt;&lt;div class=&quot;seg&quot; id=&quot;ta-match&quot;&gt;&lt;button data-match=&quot;rpm&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;Mismas rpm&lt;/button&gt;&lt;button data-match=&quot;speed&quot; type=&quot;button&quot; aria-pressed=&quot;false&quot;&gt;Misma velocidad&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;lab-main&quot;&gt;&lt;div class=&quot;dial&quot;&gt;&lt;svg id=&quot;ta-dial&quot; viewBox=&quot;0 0 320 210&quot; role=&quot;img&quot; aria-label=&quot;Indicador del régimen seleccionado&quot;&gt;&lt;/svg&gt;&lt;div class=&quot;dial-center&quot;&gt;&lt;strong id=&quot;ta-dial-number&quot;&gt;4.000&lt;/strong&gt;&lt;span id=&quot;ta-dial-unit&quot;&gt;revoluciones por minuto&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div id=&quot;ta-rpm-control&quot;&gt;&lt;label class=&quot;range-label&quot; for=&quot;ta-rpm&quot;&gt;Régimen &lt;output id=&quot;ta-rpm-out&quot;&gt;4.000 rpm&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;ta-rpm&quot; type=&quot;range&quot; min=&quot;3000&quot; max=&quot;10500&quot; step=&quot;50&quot; value=&quot;4000&quot;&gt;&lt;/div&gt;&lt;div id=&quot;ta-speed-control&quot; hidden&gt;&lt;label class=&quot;range-label&quot; for=&quot;ta-speed&quot;&gt;Velocidad teórica &lt;output id=&quot;ta-speed-out&quot;&gt;70 km/h&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;ta-speed&quot; type=&quot;range&quot; min=&quot;20&quot; max=&quot;160&quot; step=&quot;1&quot; value=&quot;70&quot;&gt;&lt;/div&gt;&lt;label class=&quot;range-label&quot;&gt;Marcha &lt;span id=&quot;ta-gear-out&quot;&gt;3ª en ambas&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;gear-buttons&quot; id=&quot;ta-gear-buttons&quot; role=&quot;group&quot; aria-label=&quot;Seleccionar marcha&quot;&gt;&lt;/div&gt;&lt;label class=&quot;range-label&quot; for=&quot;ta-load&quot;&gt;Carga estimada del motor &lt;output id=&quot;ta-load-out&quot;&gt;100 %&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;ta-load&quot; type=&quot;range&quot; min=&quot;20&quot; max=&quot;100&quot; step=&quot;5&quot; value=&quot;100&quot;&gt;&lt;p class=&quot;small&quot;&gt;Fracción del par de plena carga. No equivale al porcentaje de giro del puño.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;seg top-gap&quot; id=&quot;ta-sim-bikes&quot;&gt;&lt;button type=&quot;button&quot; data-show=&quot;both&quot; aria-pressed=&quot;true&quot;&gt;Comparar ambas&lt;/button&gt;&lt;button type=&quot;button&quot; data-show=&quot;tiger&quot; aria-pressed=&quot;false&quot;&gt;Solo Tiger&lt;/button&gt;&lt;button type=&quot;button&quot; data-show=&quot;trident&quot; aria-pressed=&quot;false&quot;&gt;Solo Trident&lt;/button&gt;&lt;/div&gt;
 &lt;div class=&quot;result-grid&quot; aria-live=&quot;polite&quot;&gt;&lt;article class=&quot;result tiger&quot; id=&quot;ta-result-tiger&quot;&gt;&lt;h3&gt;Tiger 850 Sport&lt;/h3&gt;&lt;div class=&quot;speed&quot; id=&quot;ta-tiger-speed&quot;&gt;&lt;/div&gt;&lt;p class=&quot;small&quot; id=&quot;ta-tiger-rpm&quot;&gt;&lt;/p&gt;&lt;div class=&quot;result-data&quot;&gt;&lt;div&gt;&lt;strong id=&quot;ta-tiger-power&quot;&gt;&lt;/strong&gt;&lt;span&gt;CV estimados a rueda&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong id=&quot;ta-tiger-torque&quot;&gt;&lt;/strong&gt;&lt;span&gt;Nm equivalentes tras pérdidas&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;small&quot; id=&quot;ta-tiger-force&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bar-track&quot;&gt;&lt;div class=&quot;bar-fill&quot; id=&quot;ta-tiger-bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;zone&quot; id=&quot;ta-tiger-zone&quot;&gt;&lt;/p&gt;&lt;label for=&quot;ta-mass-tiger&quot; class=&quot;range-label mass-label&quot;&gt;Masa total aproximada &lt;output id=&quot;ta-mass-tiger-out&quot;&gt;305 kg&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ta-mass-tiger&quot; min=&quot;230&quot; max=&quot;420&quot; step=&quot;1&quot; value=&quot;305&quot;&gt;&lt;p class=&quot;small&quot;&gt;Moto + combustible + piloto + equipaje. Valor inicial supuesto; ajústalo.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;result trident&quot; id=&quot;ta-result-trident&quot;&gt;&lt;h3&gt;Trident 660&lt;/h3&gt;&lt;div class=&quot;speed&quot; id=&quot;ta-trident-speed&quot;&gt;&lt;/div&gt;&lt;p class=&quot;small&quot; id=&quot;ta-trident-rpm&quot;&gt;&lt;/p&gt;&lt;div class=&quot;result-data&quot;&gt;&lt;div&gt;&lt;strong id=&quot;ta-trident-power&quot;&gt;&lt;/strong&gt;&lt;span&gt;CV estimados a rueda&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong id=&quot;ta-trident-torque&quot;&gt;&lt;/strong&gt;&lt;span&gt;Nm equivalentes tras pérdidas&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;small&quot; id=&quot;ta-trident-force&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bar-track&quot;&gt;&lt;div class=&quot;bar-fill&quot; id=&quot;ta-trident-bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;zone&quot; id=&quot;ta-trident-zone&quot;&gt;&lt;/p&gt;&lt;label for=&quot;ta-mass-trident&quot; class=&quot;range-label mass-label&quot;&gt;Masa total aproximada &lt;output id=&quot;ta-mass-trident-out&quot;&gt;274 kg&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ta-mass-trident&quot; min=&quot;220&quot; max=&quot;380&quot; step=&quot;1&quot; value=&quot;274&quot;&gt;&lt;p class=&quot;small&quot;&gt;Inicio: 189 kg en orden de marcha + 85 kg de piloto/equipo.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;
 &lt;p class=&quot;warning&quot; id=&quot;ta-running-warning&quot;&gt;&lt;/p&gt;&lt;p class=&quot;sim-footnote&quot;&gt;Modelo orientativo: carga × par de banco interpolado; fuerza = par equivalente × reducción total / radio nominal. F/masa es un índice de empuje, sin resistencia aerodinámica, rodadura, inercias, transferencia de carga ni límite de adherencia. No predice una aceleración real ni el 0–100. La velocidad es cinemática, sin deslizamiento, y no asegura que la moto pueda alcanzarla. Las zonas de carácter son etiquetas explicativas.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;wrap line&quot; id=&quot;ta-gears&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;section-num&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Sí. La Trident lleva&lt;br&gt;desarrollos más cortos.&lt;/h2&gt;&lt;p class=&quot;section-deck&quot;&gt;La diferencia está en toda la cadena: primaria, caja, piñón/corona y rueda. Compara cuánto avanza cada moto con las mismas vueltas del motor.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;legend&quot; style=&quot;margin-bottom:14px&quot;&gt;&lt;span&gt;&lt;i class=&quot;swatch&quot;&gt;&lt;/i&gt; Tiger&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;swatch&quot; style=&quot;background:var(--trident)&quot;&gt;&lt;/i&gt; Trident&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;ta-gear-mode&quot; style=&quot;margin-bottom:20px&quot;&gt;&lt;button type=&quot;button&quot; data-gearview=&quot;speed&quot; aria-pressed=&quot;true&quot;&gt;Velocidad por marcha&lt;/button&gt;&lt;button type=&quot;button&quot; data-gearview=&quot;reduction&quot; aria-pressed=&quot;false&quot;&gt;Reducción total&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;gear-layout&quot;&gt;&lt;div class=&quot;gear-visual&quot;&gt;&lt;h3 style=&quot;font-weight:500;font-size:18px&quot;&gt;&lt;span id=&quot;ta-gear-chart-title&quot;&gt;Velocidad por marcha&lt;/span&gt; &lt;span class=&quot;small&quot; id=&quot;ta-gear-chart-rpm&quot;&gt;&lt;/span&gt;&lt;/h3&gt;&lt;svg id=&quot;ta-gear-chart&quot; class=&quot;plot&quot; role=&quot;img&quot; aria-label=&quot;Velocidad teórica por marcha de ambas motocicletas al régimen seleccionado&quot;&gt;&lt;/svg&gt;&lt;label class=&quot;range-label&quot; for=&quot;ta-gearrpm&quot;&gt;Régimen para desarrollos &lt;output id=&quot;ta-gearrpm-out&quot;&gt;4.000 rpm&lt;/output&gt;&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;ta-gearrpm&quot; min=&quot;3000&quot; max=&quot;8500&quot; step=&quot;100&quot; value=&quot;4000&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;tag&quot;&gt;De cigüeñal a rueda&lt;/span&gt;&lt;div class=&quot;formula-line&quot;&gt;&lt;b&gt;Primaria&lt;/b&gt; × &lt;b&gt;Marcha&lt;/b&gt; × &lt;b&gt;Final&lt;/b&gt; = &lt;b&gt;Reducción total&lt;/b&gt;&lt;/div&gt;&lt;table&gt;&lt;caption&gt;Transmisión de serie&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Relación&lt;/th&gt;&lt;th&gt;Tiger&lt;/th&gt;&lt;th&gt;Trident&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Primaria&lt;/td&gt;&lt;td&gt;76/46 · 1,652&lt;/td&gt;&lt;td&gt;76/41 · 1,854&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Corona / piñón&lt;/td&gt;&lt;td&gt;50/16 · 3,125&lt;/td&gt;&lt;td&gt;51/16 · 3,188&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Neumático trasero&lt;/td&gt;&lt;td&gt;150/70 R17&lt;/td&gt;&lt;td&gt;180/55 ZR17&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Circunferencia nominal&lt;/td&gt;&lt;td&gt;2,016 m&lt;/td&gt;&lt;td&gt;1,979 m&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;gear-callout&quot;&gt;&lt;strong id=&quot;ta-gear-key&quot;&gt;&lt;/strong&gt;&lt;p id=&quot;ta-gear-comment&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;provenance&quot;&gt;Ratios de manuales Triumph. El perímetro se calcula de la medida nominal; el real cambia con neumático, presión, carga y desgaste.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;table-scroll&quot;&gt;&lt;table&gt;&lt;caption&gt;Las seis marchas, sin atajos&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Marcha&lt;/th&gt;&lt;th&gt;Caja Tiger&lt;/th&gt;&lt;th&gt;Caja Trident&lt;/th&gt;&lt;th&gt;Total Tiger&lt;/th&gt;&lt;th&gt;Total Trident&lt;/th&gt;&lt;th&gt;km/h Tiger&lt;/th&gt;&lt;th&gt;km/h Trident&lt;/th&gt;&lt;th&gt;Desarrollo Trident&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ta-gear-table&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
 &lt;details&gt;&lt;summary&gt;Leer los números: una reducción mayor significa un desarrollo más corto&lt;/summary&gt;&lt;p&gt;Velocidad (km/h) = rpm × circunferencia (m) × 60 / (reducción total × 1.000). La primaria y la final de la Trident ya multiplican más. En cuarta, quinta y sexta, la relación interna de caja coincide en ambas; aun así la Trident avanza un 14,25 % menos por vuelta de motor. A la misma velocidad, eso supone un 16,62 % más de rpm.&lt;/p&gt;&lt;p&gt;Una marcha corta puede compensar parte del menor par del motor. Por eso «más Nm al cigüeñal» no basta para concluir qué moto acelera más: también importan el régimen al que trabaja cada una y su masa total. El simulador permite comprobarlo cambiando de «mismas rpm» a «misma velocidad».&lt;/p&gt;&lt;/details&gt;
&lt;/section&gt;
&lt;section class=&quot;wrap line&quot; id=&quot;ta-feel&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;section-num&quot;&gt;04&lt;/span&gt;&lt;div&gt;&lt;h2 class=&quot;section-title&quot;&gt;La sensación tiene&lt;br&gt;más de una causa.&lt;/h2&gt;&lt;p class=&quot;section-deck&quot;&gt;«Lineal» puede describir la progresión del empuje, la respuesta del puño o la facilidad para usar el motor. No significa que el par sea una recta perfecta.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;explain-grid&quot;&gt;&lt;article class=&quot;mechanic&quot;&gt;&lt;span class=&quot;tag&quot;&gt;01 / Cilindrada&lt;/span&gt;&lt;div class=&quot;displacement&quot;&gt;&lt;div&gt;&lt;span&gt;Tiger · 888 cm³&lt;/span&gt;&lt;i class=&quot;vol&quot; style=&quot;height:74px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;trident&quot;&gt;&lt;span&gt;Trident · 660 cm³&lt;/span&gt;&lt;i class=&quot;vol&quot; style=&quot;height:55px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;Un 34,5 % más de cilindrada.&lt;/h3&gt;&lt;p&gt;La Tiger mueve más volumen en cada ciclo. Sus 82 Nm máximos frente a 64 Nm dan una base cuantitativa a esa reserva de empuje. No es una proporcionalidad exacta: la puesta a punto también cuenta.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;mechanic&quot;&gt;&lt;span class=&quot;tag&quot;&gt;02 / Régimen y potencia&lt;/span&gt;&lt;div class=&quot;rev-strips&quot;&gt;&lt;div class=&quot;rev-strip&quot;&gt;&lt;span&gt;Tiger&lt;/span&gt;&lt;div class=&quot;rev-track&quot;&gt;&lt;i style=&quot;width:80.95%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;b&gt;8.500 rpm&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;rev-strip trident&quot;&gt;&lt;span&gt;Trident&lt;/span&gt;&lt;div class=&quot;rev-track&quot;&gt;&lt;i style=&quot;width:97.62%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;b&gt;10.250 rpm&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;Par parecido, más rpm, más potencia.&lt;/h3&gt;&lt;p&gt;Si un motor mantuviera 60 Nm, pasaría de unos 34 CV a 4.000 rpm a unos 60 CV a 7.000. Es física, no una segunda entrega oculta. Esta es una parte de lo que interpretas como «despertar».&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;mechanic&quot;&gt;&lt;span class=&quot;tag&quot;&gt;03 / Pulsos de combustión&lt;/span&gt;&lt;svg class=&quot;ignition&quot; id=&quot;ta-ignition&quot; role=&quot;img&quot; aria-label=&quot;Intervalos de encendido en 720 grados de giro: Tiger 180, 270 y 270; Trident 240, 240 y 240&quot;&gt;&lt;/svg&gt;&lt;h3&gt;Ambos son triples.&lt;br&gt;No laten igual.&lt;/h3&gt;&lt;p&gt;La Tiger utiliza el cigüeñal T-plane y pulsos desiguales. La Trident emplea intervalos regulares. El diagrama es un esquema de estas arquitecturas, no una medición de las unidades. Esto cambia tacto, vibración y sonido; no demuestra por sí solo que una curva de par sea más plana. El tacto más lleno de la Tiger y su pulsación marcada pueden coexistir.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;mechanic&quot;&gt;&lt;span class=&quot;tag&quot;&gt;04 / Gas, cambio y masa&lt;/span&gt;&lt;span class=&quot;big-number&quot; style=&quot;margin-top:22px&quot;&gt;Motor → suelo&lt;/span&gt;&lt;h3&gt;El puño añade otra variable.&lt;/h3&gt;&lt;p&gt;Las curvas de banco son a plena carga. En carretera intervienen la apertura real de las mariposas, el modo de conducción, la marcha y el peso. Sin mapas de acelerador no se puede atribuir con rigor una transición a 4.000 rpm a la electrónica. La Tribute añade Shift Assist de serie; eso facilita cambiar, pero no aporta más potencia.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;wrap line&quot; id=&quot;ta-running&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;section-num&quot;&gt;05&lt;/span&gt;&lt;div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Tu Trident está en rodaje.&lt;br&gt;Y eso cambia la comparación.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;run-in&quot;&gt;&lt;div&gt;&lt;span class=&quot;tag&quot;&gt;Aviso que has observado&lt;/span&gt;&lt;div class=&quot;run-big&quot; id=&quot;ta-run-big&quot;&gt;4.000 &lt;span&gt;rpm&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;section-deck&quot;&gt;Si cambias cuando aparece el primer aviso, dejas fuera buena parte del régimen disponible de la Trident. La Tiger entrega su potencia máxima antes; la Trident todavía tiene mucha zona por explorar.&lt;/p&gt;&lt;div class=&quot;run-select&quot;&gt;&lt;label class=&quot;range-label&quot; for=&quot;ta-runlimit&quot;&gt;Aviso representado en los gráficos&lt;/label&gt;&lt;select id=&quot;ta-runlimit&quot;&gt;&lt;option value=&quot;4000&quot;&gt;4.000 rpm · tu aviso inicial&lt;/option&gt;&lt;option value=&quot;5000&quot;&gt;5.000 rpm · explorar otro umbral&lt;/option&gt;&lt;option value=&quot;6000&quot;&gt;6.000 rpm · explorar otro umbral&lt;/option&gt;&lt;option value=&quot;7000&quot;&gt;7.000 rpm · explorar otro umbral&lt;/option&gt;&lt;option value=&quot;0&quot;&gt;Ocultar referencia de rodaje&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Es una referencia visual editable. No altera la curva ni simula un limitador. Los valores de 5.000, 6.000 y 7.000 no se presentan como calendario oficial por kilómetros.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;steps&quot;&gt;&lt;div class=&quot;step active&quot; data-threshold=&quot;4000&quot;&gt;&lt;strong&gt;4.000&lt;/strong&gt;tu aviso&lt;/div&gt;&lt;div class=&quot;step&quot; data-threshold=&quot;5000&quot;&gt;&lt;strong&gt;5.000&lt;/strong&gt;referencia&lt;/div&gt;&lt;div class=&quot;step&quot; data-threshold=&quot;6000&quot;&gt;&lt;strong&gt;6.000&lt;/strong&gt;referencia&lt;/div&gt;&lt;div class=&quot;step&quot; data-threshold=&quot;7000&quot;&gt;&lt;strong&gt;7.000&lt;/strong&gt;referencia&lt;/div&gt;&lt;/div&gt;&lt;h3 style=&quot;font-size:20px;font-weight:500&quot;&gt;Aviso progresivo, no desbloqueo de potencia.&lt;/h3&gt;&lt;p class=&quot;section-deck&quot; style=&quot;font-size:15px&quot;&gt;El manual describe un modo de aviso de cambio durante el rodaje; el ajuste pasa automáticamente a «Default» a 1.600 km. Esto es distinto de las fases de rodaje mecánico. No hay evidencia aquí de una limitación electrónica de potencia que desaparezca después de la primera revisión.&lt;/p&gt;&lt;p class=&quot;section-deck&quot; style=&quot;font-size:15px&quot;&gt;Durante los primeros 1.000 km, Triumph pide evitar el gas a fondo y los regímenes elevados, no superar tres cuartas partes del régimen máximo, variar el régimen y no exigir el motor en marchas largas a bajas vueltas. De 1.000 a 1.500 km, la carga y el régimen pueden aumentar gradualmente según el manual.&lt;/p&gt;&lt;p class=&quot;small top-gap&quot;&gt;El umbral exacto de tu cuadro y las instrucciones de tu manual/VIN mandan. El simulador sirve para entender la mecánica; no prescribe cómo completar el rodaje.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;wrap closing&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Lo que te está contando cada motor&lt;/div&gt;&lt;h2&gt;La Tiger permite conservar la marcha.&lt;br&gt;La Trident invita a usar más régimen.&lt;/h2&gt;&lt;div class=&quot;closing-grid&quot;&gt;&lt;p&gt;Vienes de un motor de 888 cm³ con más par y desarrollos largos. A ritmo habitual, esa combinación puede sentirse llena y poco exigente con el cambio. La Trident compensa parte de su menor par con más multiplicación y menos masa.&lt;/p&gt;&lt;p&gt;Sus marchas son más cortas de verdad. Su potencia llega más arriba. Y tu aviso a 4.000 rpm corta pronto la exploración. La sensación que describes es coherente con esa combinación; los datos no justifican un salto brusco de par exactamente a 4.000.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;wrap&quot; id=&quot;ta-sources&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;section-num&quot;&gt;↗&lt;/span&gt;&lt;div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Datos que puedes rastrear.&lt;/h2&gt;&lt;p class=&quot;section-deck&quot;&gt;Corte de investigación: 26 de septiembre de 2026. Alcance: Tiger 850 Sport 2024 y la primera Triple Tribute presentada en marzo de 2024, blanca, azul y roja.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;data-ribbon&quot;&gt;La Triple Tribute presentada en 2024 aparece como MY2025 en parte de la documentación comercial. La identificación aquí es la edición blanca original del comunicado de marzo de 2024. Se excluyen la Tribute posterior y las revisiones posteriores de la Trident.&lt;/p&gt;&lt;div class=&quot;source-list&quot; id=&quot;ta-source-list&quot;&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;Método, unidades y límites del modelo&lt;/summary&gt;&lt;p&gt;Se toman las versiones europeas sin limitación A2, transmisión y medidas de rueda de serie. Una unidad limitada, una corona modificada o un neumático distinto cambiarían la comparación. 1 hp = 0,745700 kW; 1 CV/PS = 0,735499 kW; 1 lb·ft = 1,355818 Nm. Triumph redondea las equivalencias en sus fichas; aquí se conservan sus cifras en CV.&lt;/p&gt;&lt;p&gt;Los máximos oficiales son al motor. Los de Cycle World son a rueda. La diferencia entre ambos no se trata como una medición de pérdidas, ya que cambian unidades, ejemplares, condiciones y procedimiento. No se encontró una pareja de curvas completas oficiales o ensayos exactos de ambas ediciones 2024.&lt;/p&gt;&lt;p&gt;Los puntos de curva leídos del gráfico se interpolan linealmente. Las cifras dinámicas se redondean para no sugerir precisión de laboratorio. La incertidumbre gráfica no incluye diferencias de mantenimiento, temperatura, banco o mapa. El simulador mantiene constante la fracción de carga elegida, una simplificación que no representa un mapa de acelerador.&lt;/p&gt;&lt;p&gt;Se distinguen 192 kg secos declarados de Tiger y 189 kg en orden de marcha de Trident. No se comparan directamente como si fueran el mismo tipo de pesaje. En el simulador se introducen masas totales editables; 305 kg para Tiger es un escenario supuesto y 274 kg para Trident equivale a 189 + 85 kg.&lt;/p&gt;&lt;p&gt;Las fotografías son material oficial de Triumph, integrado con atribución como referencia de producto. No se atribuye una licencia abierta ni autorización de reutilización publicitaria. Las ilustraciones de pulsos y transmisión son esquemas explicativos.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;
