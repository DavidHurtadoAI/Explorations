<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesa editorial visual 2026</title>
  <style>
    :root {
      --paper: #FFFCF0;
      --paper-2: #F2F0E5;
      --paper-3: #E6E4D9;
      --ink: #100F0F;
      --muted: #6F6E69;
      --muted-2: #878580;
      --line: #DAD8CE;
      --blue: #205EA6;
      --red: #AF3029;
      --green: #66800B;
      --orange: #BC5215;
      --purple: #5E409D;
      --teal: #24837B;
      --yellow: #AD8301;
      --panel: rgba(255, 252, 240, 0.94);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.35;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(280px, 420px) auto;
      gap: 18px;
      align-items: end;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      margin-top: 2px;
      font-size: 26px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    .brand p {
      margin-top: 6px;
      max-width: 720px;
      color: var(--muted);
      font-size: 14px;
    }

    .search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .search input {
      min-width: 0;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffef8;
      color: var(--ink);
      padding: 0 12px;
      outline: none;
    }

    .search input:focus {
      border-color: var(--blue);
    }

    .icon-button,
    .text-button,
    .chip-button,
    .mode-button,
    .filter-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffef8;
      color: var(--ink);
      min-height: 34px;
      padding: 7px 10px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
      line-height: 1;
    }

    .text-button:hover,
    .chip-button:hover,
    .mode-button:hover,
    .filter-button:hover,
    .icon-button:hover {
      border-color: var(--muted-2);
      background: var(--paper-2);
    }

    .stats {
      display: grid;
      grid-auto-flow: column;
      gap: 10px;
      align-items: end;
      justify-content: end;
    }

    .stat {
      min-width: 74px;
      padding: 5px 0;
      border-left: 1px solid var(--line);
      padding-left: 10px;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .guide-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    .chip-button {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .chip-button::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--blue);
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 360px;
    }

    .left-panel,
    .inspector {
      min-height: 0;
      overflow: auto;
      background: var(--paper-2);
    }

    .left-panel {
      border-right: 1px solid var(--line);
      padding: 14px;
    }

    .inspector {
      border-left: 1px solid var(--line);
      padding: 16px;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 16px;
    }

    .mode-button {
      text-align: left;
      font-weight: 720;
    }

    .mode-button.active,
    .filter-button.active,
    .chip-button.active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    .filter-section {
      margin-top: 18px;
    }

    .filter-section h2 {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 8px;
    }

    .filter-stack {
      display: grid;
      gap: 6px;
    }

    .filter-button {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      text-align: left;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 99px;
      background: var(--muted-2);
    }

    .count {
      color: var(--muted);
      font-size: 12px;
    }

    .active .count {
      color: rgba(255, 252, 240, 0.7);
    }

    .content-area {
      min-height: 0;
      overflow: auto;
      scroll-behavior: smooth;
      background: var(--paper);
    }

    .view-head {
      position: sticky;
      top: 0;
      z-index: 8;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 252, 240, 0.96);
      backdrop-filter: blur(10px);
    }

    .view-head h2 {
      font-size: 20px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .view-head p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .view-tools {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .card-wall {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      grid-auto-flow: dense;
      gap: 12px;
      padding: 16px 18px 24px;
    }

    .piece-card {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fffef8;
      transition: border-color 140ms ease, transform 140ms ease, background 140ms ease;
    }

    .piece-card:hover,
    .piece-card.active {
      border-color: var(--ink);
      transform: translateY(-1px);
    }

    .piece-card.feature {
      grid-column: span 2;
    }

    .piece-card.wide {
      grid-column: span 2;
    }

    .visual {
      position: relative;
      aspect-ratio: 16 / 9;
      background: var(--paper-3);
      overflow: hidden;
    }

    .piece-card.feature .visual {
      aspect-ratio: 21 / 9;
    }

    .visual img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--paper);
      font-weight: 850;
      font-size: 32px;
      background: var(--accent, var(--blue));
    }

    .family-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 7px;
      border-radius: 8px;
      background: rgba(16, 15, 15, 0.78);
      color: var(--paper);
      font-size: 12px;
      font-weight: 740;
    }

    .piece-body {
      min-width: 0;
      padding: 11px 12px 12px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .piece-card h3 {
      font-size: 16px;
      line-height: 1.16;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .piece-card.feature h3 {
      font-size: 20px;
    }

    .excerpt {
      color: #3A3935;
      font-size: 13px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tag-row,
    .tiny-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag,
    .tiny-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 3px 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      background: rgba(255, 252, 240, 0.72);
    }

    .tag::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: var(--accent, var(--muted-2));
      flex: 0 0 auto;
    }

    .empty-state {
      padding: 30px 18px;
      color: var(--muted);
    }

    .month-section,
    .route-section,
    .host-section {
      padding: 16px 18px 18px;
      border-bottom: 1px solid var(--line);
    }

    .month-title,
    .route-title,
    .host-title {
      display: flex;
      gap: 10px;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .month-title h3,
    .route-title h3,
    .host-title h3 {
      font-size: 18px;
      letter-spacing: 0;
      text-transform: capitalize;
    }

    .route-title p,
    .host-title p {
      color: var(--muted);
      font-size: 13px;
      max-width: 560px;
    }

    .shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
    }

    .route-lane {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .step-card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffef8;
      padding: 10px;
      display: grid;
      gap: 7px;
      align-content: start;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .step-card:hover,
    .step-card.active {
      border-color: var(--ink);
      background: var(--paper);
    }

    .step-number {
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
    }

    .step-card h4 {
      margin: 0;
      font-size: 14px;
      line-height: 1.18;
      overflow-wrap: anywhere;
    }

    .source-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }

    .source-row:first-of-type {
      border-top: 0;
    }

    .source-row button {
      text-align: left;
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--ink);
    }

    .source-row small {
      color: var(--muted);
    }

    .inspector-hero {
      display: grid;
      gap: 12px;
    }

    .inspector-visual {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      background: var(--paper-3);
    }

    .inspector h2 {
      font-size: 22px;
      line-height: 1.12;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .inspector p {
      margin-top: 9px;
      color: #3A3935;
    }

    .inspector-section {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .inspector-section h3 {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0;
      margin-bottom: 8px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .action-row a,
    .action-row button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border: 1px solid var(--ink);
      border-radius: 8px;
      background: var(--ink);
      color: var(--paper);
      padding: 7px 10px;
      text-decoration: none;
      font-weight: 740;
    }

    .action-row button.secondary {
      background: #fffef8;
      color: var(--ink);
      border-color: var(--line);
    }

    .related-list,
    .source-list {
      display: grid;
      gap: 7px;
    }

    .related-item,
    .source-link {
      min-width: 0;
      display: grid;
      gap: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffef8;
      color: inherit;
      text-decoration: none;
      padding: 8px;
      text-align: left;
    }

    .related-item {
      cursor: pointer;
    }

    .related-item strong,
    .source-link strong {
      font-size: 13px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .related-item span,
    .source-link span {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: 230px minmax(0, 1fr);
      }

      .inspector {
        grid-column: 1 / -1;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }

    @media (max-width: 880px) {
      .topbar {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .stats {
        justify-content: start;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .left-panel {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        overflow: visible;
      }

      .mode-tabs,
      .filter-stack {
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      }

      .piece-card.feature,
      .piece-card.wide {
        grid-column: span 1;
      }

      .view-head {
        position: static;
      }
    }

    @media (max-width: 560px) {
      .topbar,
      .guide-strip,
      .left-panel,
      .view-head,
      .card-wall,
      .month-section,
      .route-section,
      .host-section {
        padding-left: 12px;
        padding-right: 12px;
      }

      .view-head {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-auto-flow: row;
        gap: 4px;
      }

      .stat {
        border-left: 0;
        padding-left: 0;
      }
    }
  </style>
</head>

      <aside class="inspector" id="inspector"></aside>

  </div>

    const byId = new Map(DATA.items.map(function(item) { return [item.id, item]; }));

    const state = {
      mode: "explore",
      query: "",

    };

    const dateFormatter = new Intl.DateTimeFormat("es-ES", { day: "2-digit", month: "short" });

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normalize(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function setState(patch) {
      Object.assign(state, patch);
      render();
    }

    function selectedRouteIds() {
      if (state.route === "all") return null;
      const route = routeById.get(state.route);
      return route ? new Set(route.itemIds) : null;
    }

    function searchable(item) {
      return normalize([
        item.title,
        item.description,
        item.excerpt,
        item.path,
        item.topic.join(" "),
        item.externalLinks.map(function(link) { return link.host + " " + link.label; }).join(" ")
      ].join(" "));
    }

    function filteredItems(options) {
      const opts = options || {};
      const routeIds = opts.ignoreRoute ? null : selectedRouteIds();
      const query = normalize(state.query);
      return DATA.items.filter(function(item) {
        if (routeIds && !routeIds.has(item.id)) return false;
        if (!opts.ignoreMonth && state.month !== "all" && item.month !== state.month) return false;
        if (!opts.ignoreConcept && state.concept !== "all" && !item.concepts.includes(state.concept)) return false;
        if (!opts.ignoreFamily && state.family !== "all" && item.family !== state.family) return false;
        if (state.host !== "all" && !item.externalLinks.some(function(link) { return link.host === state.host; })) return false;
        if (query && !searchable(item).includes(query)) return false;
        return true;
      });
    }

    function sortNewest(items) {
      return items.slice().sort(function(a, b) {
        return b.date.localeCompare(a.date) || b.importance - a.importance || a.title.localeCompare(b.title);
      });
    }

    function conceptTags(item, limit) {
      return item.concepts.slice(0, limit || 3).map(function(id) {
        const concept = conceptById.get(id);
        if (!concept) return "";
        return '<span class="tag" style="--accent:' + concept.color + '">' + escapeHtml(concept.short || concept.name) + '</span>';
      }).join("");
    }

    function visualHtml(item, compact) {
      const concept = conceptById.get(item.primaryConceptId) || DATA.concepts[0];
      const initials = item.family === "Newsletter" ? "NL" : item.family === "Eco" ? "EC" : item.title.slice(0, 2).toUpperCase();
      const badge = compact ? "" : '<span class="family-badge">' + escapeHtml(familyLabels[item.family] || item.family) + '</span>';
      if (item.image) {
        return '<div class="visual"><img src="' + item.image + '" alt="">' + badge + '</div>';
      }
      return '<div class="visual"><div class="placeholder" style="--accent:' + concept.color + '">' + escapeHtml(initials) + '</div>' + badge + '</div>';
    }

    function cardHtml(item) {
      const concept = conceptById.get(item.primaryConceptId) || DATA.concepts[0];
      const active = item.id === state.selectedId ? " active" : "";
      const size = item.visualSize === "feature" || item.visualSize === "wide" ? " " + item.visualSize : "";
      return '<article class="piece-card' + size + active + '" data-id="' + item.id + '" tabindex="0" style="--accent:' + concept.color + '">' +
        visualHtml(item, false) +
        '<div class="piece-body">' +
          '<div class="meta"><span>' + escapeHtml(dateFormatter.format(new Date(item.date + "T00:00:00"))) + '</span><span>' + escapeHtml(familyLabels[item.family] || item.family) + '</span><span>' + item.wordCount + ' palabras</span></div>' +
          '<h3>' + escapeHtml(item.title) + '</h3>' +
          '<p class="excerpt">' + escapeHtml(item.excerpt || item.description || "") + '</p>' +
          '<div class="tag-row">' + conceptTags(item, 3) + '</div>' +
        '</div>' +
      '</article>';
    }

    function stepHtml(item, index) {
      const active = item.id === state.selectedId ? " active" : "";
      const concept = conceptById.get(item.primaryConceptId) || DATA.concepts[0];
      return '<button class="step-card' + active + '" type="button" data-id="' + item.id + '" style="--accent:' + concept.color + '">' +
        '<span class="step-number">' + String(index + 1).padStart(2, "0") + ' · ' + escapeHtml(dateFormatter.format(new Date(item.date + "T00:00:00"))) + '</span>' +
        '<h4>' + escapeHtml(item.title) + '</h4>' +

      '</button>';
    }

    function bindSelectable(root) {
      root.querySelectorAll("[data-id]").forEach(function(node) {
        node.addEventListener("click", function() {
          setState({ selectedId: node.dataset.id });
        });
        node.addEventListener("keydown", function(event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            setState({ selectedId: node.dataset.id });
          }
        });
      });
    }

        if (!monthItems.length) return "";
        return '<section class="month-section">' +
          '<div class="month-title"><h3>' + escapeHtml(month.label) + '</h3><span class="count">' + monthItems.length + ' piezas</span></div>' +
          '<div class="shelf">' + monthItems.map(function(item, index) { return stepHtml(item, index); }).join("") + '</div>' +
        '</section>';
      }).join("") || '<div class="empty-state">No hay piezas con estos filtros.</div>';
      bindSelectable(root);
    }

    function renderRoutes(items) {
      const root = document.getElementById("viewRoot");
      const visible = new Set(items.map(function(item) { return item.id; }));
      const routes = DATA.routes.filter(function(route) {
        return state.route === "all" || state.route === route.id;
      });
      root.innerHTML = routes.map(function(route) {
        const routeItems = route.itemIds.map(function(id) { return byId.get(id); }).filter(Boolean).filter(function(item) { return visible.has(item.id); });
        if (!routeItems.length) return "";
        return '<section class="route-section">' +
          '<div class="route-title"><div><h3>' + escapeHtml(route.title) + '</h3><p>' + escapeHtml(route.subtitle) + '</p></div><span class="count">' + routeItems.length + ' piezas</span></div>' +
          '<div class="route-lane">' + routeItems.map(stepHtml).join("") + '</div>' +
        '</section>';
      }).join("") || '<div class="empty-state">No hay ruta con estos filtros.</div>';
      bindSelectable(root);
    }

    function renderSources(items) {
      const root = document.getElementById("viewRoot");
      const visible = new Set(items.map(function(item) { return item.id; }));
      const hosts = DATA.hosts.filter(function(host) {
        return host.itemIds.some(function(id) { return visible.has(id); });
      });

      root.innerHTML = hosts.map(function(host) {
        const hostItems = sortNewest(host.itemIds.map(function(id) { return byId.get(id); }).filter(Boolean).filter(function(item) { return visible.has(item.id); }));
        return '<section class="host-section">' +
          '<div class="host-title"><div><h3>' + escapeHtml(host.host) + '</h3><p>' + host.count + ' enlaces en ' + hostItems.length + ' piezas</p></div>' +
          '<button class="text-button" type="button" data-host="' + escapeHtml(host.host) + '">Filtrar</button></div>' +
          hostItems.map(function(item) {
            return '<div class="source-row"><button type="button" data-id="' + item.id + '"><strong>' + escapeHtml(item.title) + '</strong><br><small>' + escapeHtml(item.date) + ' · ' + escapeHtml(familyLabels[item.family] || item.family) + '</small></button><span class="count">' + item.externalLinks.filter(function(link) { return link.host === host.host; }).length + '</span></div>';
          }).join("") +
        '</section>';
      }).join("") || '<div class="empty-state">No hay fuentes externas con estos filtros.</div>';

      root.querySelectorAll("[data-host]").forEach(function(button) {
        button.addEventListener("click", function() { setState({ host: button.dataset.host }); });
      });
      bindSelectable(root);
    }

    function relatedItems(item, scopeItems) {
      if (!item) return [];
      const candidates = (scopeItems && scopeItems.length > 1) ? scopeItems : DATA.items;
      return candidates
        .filter(function(candidate) { return candidate.id !== item.id; })
        .map(function(candidate) {
          const sharedConcepts = candidate.concepts.filter(function(id) { return item.concepts.includes(id); }).length;
          const sameMonth = candidate.month === item.month ? 1 : 0;
          const sameFamily = candidate.family === item.family ? 0.4 : 0;
          return { item: candidate, score: sharedConcepts * 3 + sameMonth + sameFamily + candidate.importance * 0.1 };
        })
        .filter(function(entry) { return entry.score > 0; })
        .sort(function(a, b) { return b.score - a.score || b.item.date.localeCompare(a.item.date); })
        .slice(0, 5)
        .map(function(entry) { return entry.item; });
    }

    function selectedIndex(items) {
      return Math.max(0, items.findIndex(function(item) { return item.id === state.selectedId; }));
    }

    function renderInspector(items) {
      const inspector = document.getElementById("inspector");
      const visible = sortNewest(items);
      let selected = byId.get(state.selectedId);
      if (!selected || !items.some(function(item) { return item.id === selected.id; })) selected = visible[0] || DATA.items[DATA.items.length - 1];
      if (!selected) {
        inspector.innerHTML = "";
        return;
      }
      state.selectedId = selected.id;

      const concepts = selected.concepts.map(function(id) { return conceptById.get(id); }).filter(Boolean);
      const concept = conceptById.get(selected.primaryConceptId) || DATA.concepts[0];
      const related = relatedItems(selected, items);
      const index = selectedIndex(visible);
      const prev = visible[index - 1] || visible[visible.length - 1];
      const next = visible[index + 1] || visible[0];

      inspector.innerHTML =
        '<div class="inspector-hero">' +
          '<div class="inspector-visual">' + (selected.image ? '<img src="' + selected.image + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block">' : '<div class="placeholder" style="--accent:' + concept.color + '">' + escapeHtml(selected.title.slice(0, 2).toUpperCase()) + '</div>') + '</div>' +
          '<div class="meta"><span>' + escapeHtml(dateFormatter.format(new Date(selected.date + "T00:00:00"))) + '</span><span>' + escapeHtml(familyLabels[selected.family] || selected.family) + '</span><span>' + selected.wordCount + ' palabras</span></div>' +
          '<h2>' + escapeHtml(selected.title) + '</h2>' +
        '</div>' +
        '<p>' + escapeHtml(selected.excerpt || selected.description || "") + '</p>' +
        '<div class="action-row"><a href="' + selected.url + '" target="_blank" rel="noreferrer">Abrir pieza</a><button class="secondary" id="prevItem" type="button">‹</button><button class="secondary" id="nextItem" type="button">›</button></div>' +
        '<section class="inspector-section"><h3>Territorios</h3><div class="tag-row">' + concepts.map(function(itemConcept) { return '<span class="tag" style="--accent:' + itemConcept.color + '">' + escapeHtml(itemConcept.name) + '</span>'; }).join("") + selected.topic.map(function(topic) { return '<span class="tiny-tag">' + escapeHtml(topic) + '</span>'; }).join("") + '</div></section>' +
        (selected.externalLinks.length ? '<section class="inspector-section"><h3>Fuentes</h3><div class="source-list">' + selected.externalLinks.slice(0, 6).map(function(link) { return '<a class="source-link" href="' + link.url + '" target="_blank" rel="noreferrer"><strong>' + escapeHtml(link.label || link.host) + '</strong><span>' + escapeHtml(link.host) + '</span></a>'; }).join("") + '</div></section>' : "") +
        '<section class="inspector-section"><h3>Cerca de esta pieza</h3><div class="related-list">' + related.map(function(item) { return '<button class="related-item" type="button" data-related="' + item.id + '"><strong>' + escapeHtml(item.title) + '</strong><span>' + escapeHtml(item.date) + ' · ' + escapeHtml(familyLabels[item.family] || item.family) + '</span></button>'; }).join("") + '</div></section>';

      document.getElementById("prevItem").addEventListener("click", function() { if (prev) setState({ selectedId: prev.id }); });
      document.getElementById("nextItem").addEventListener("click", function() { if (next) setState({ selectedId: next.id }); });
      inspector.querySelectorAll("[data-related]").forEach(function(button) {
        button.addEventListener("click", function() { setState({ selectedId: button.dataset.related }); });
      });
    }

    function renderView(items) {
      const title = document.getElementById("viewTitle");
      const subtitle = document.getElementById("viewSubtitle");
      const route = state.route !== "all" ? routeById.get(state.route) : null;
      const titles = {
        explore: "Descubrir",
        months: "Meses",
        routes: route ? route.title : "Rutas",
        sources: "Fuentes"
      };
      title.textContent = titles[state.mode] || "Descubrir";
      subtitle.textContent = route ? route.subtitle : items.length + " piezas filtradas de " + DATA.summary.total;

      if (state.mode === "months") renderMonths(items);
      else if (state.mode === "routes") renderRoutes(items);
      else if (state.mode === "sources") renderSources(items);
      else renderExplore(items);
    }

    function render() {
      const items = filteredItems();
      if (!items.some(function(item) { return item.id === state.selectedId; }) && items.length) {
        state.selectedId = sortNewest(items)[0].id;
      }
      renderStats(items);
      renderControls();
      renderView(items);
      renderInspector(items);
    }

    document.getElementById("searchInput").addEventListener("input", function(event) {
      setState({ query: event.target.value.trim(), route: "all", host: "all" });
    });

    document.getElementById("clearSearch").addEventListener("click", function() {
      document.getElementById("searchInput").value = "";
      setState({ query: "", route: "all", host: "all" });
    });

    document.getElementById("resetFilters").addEventListener("click", function() {
      document.getElementById("searchInput").value = "";
      setState({ query: "", month: "all", concept: "all", family: "all", route: "all", host: "all" });
    });

    document.querySelectorAll(".mode-button").forEach(function(button) {
      button.addEventListener("click", function() { setState({ mode: button.dataset.mode }); });
    });

    render();
  </script>
</body>
</html>
