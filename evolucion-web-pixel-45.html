/* ---------- primitivas pixel (siempre coordenadas enteras) ---------- */
function R(x,y,w,h,c){w=rd(w);h=rd(h);if(w<=0||h<=0)return;g.fillStyle=c;g.fillRect(rd(x),rd(y),w,h);}
function P(x,y,c){g.fillStyle=c;g.fillRect(rd(x),rd(y),1,1);}
function linePts(x0,y0,x1,y1){x0=rd(x0);y0=rd(y0);x1=rd(x1);y1=rd(y1);const p=[];const dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1;let e=dx+dy;for(let n=0;n<999;n++){p.push([x0,y0]);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}return p;}
function line(x0,y0,x1,y1,c){g.fillStyle=c;for(const p of linePts(x0,y0,x1,y1))g.fillRect(p[0],p[1],1,1);}
function circ(cx,cy,r,c,dash){cx=rd(cx);cy=rd(cy);r=rd(r);if(r<1){P(cx,cy,c);return;}g.fillStyle=c;let x=r,y=0,e=1-r,i=0;while(x>=y){const q=[[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]];for(const[a,b]of q)if(!dash||(i&1)===0)g.fillRect(cx+a,cy+b,1,1);y++;i++;if(e<0)e+=2*y+1;else{x--;e+=2*(y-x)+1;}}}
function disc(cx,cy,r,c){cx=rd(cx);cy=rd(cy);r=rd(r);g.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y+r*.8));g.fillRect(cx-w,cy+y,2*w+1,1);}}
function rbox(x,y,w,h,fill,out){x=rd(x);y=rd(y);w=rd(w);h=rd(h);R(x+1,y,w-2,h,out);R(x,y+1,w,h-2,out);if(fill)R(x+1,y+1,w-2,h-2,fill);}
function box(x,y,w,h,fill,out){x=rd(x);y=rd(y);w=rd(w);h=rd(h);R(x,y,w,h,out);R(x+1,y+1,w-2,h-2,fill);}
function dotted(x,y,w,h,c){x=rd(x);y=rd(y);w=rd(w);h=rd(h);g.fillStyle=c;for(let i=0;i<w;i+=2){g.fillRect(x+i,y,1,1);g.fillRect(x+i,y+h-1,1,1);}for(let j=0;j<h;j+=2){g.fillRect(x,y+j,1,1);g.fillRect(x+w-1,y+j,1,1);}}

  if(A.fing)limbOn(linePts(A.fing[0][0],A.fing[0][1]+oy,A.fing[1][0],A.fing[1][1]+oy),()=>C.w2,1);
 });

 poolN=0;
 for(const b of BURSTS){const d=(t-b.t)*K;if(d<0||d>b.life)continue;
  for(let i=0;i<b.n&&poolN<POOL.length;i++){
   const h1=hash(b.seed+i*1.37),h2=hash(b.seed+i*2.71+5),h3=hash(b.seed+i*3.93+9);
   const life=b.life*(.5+.5*h3);if(d>life)continue;const u=d/life;const p=POOL[poolN++];p.c=b.cols[i%b.cols.length];p.k=0;
   if(b.kind==='spark'){const a=h1*Math.PI*2,sp=b.spd*(.35+.65*h2);p.x=b.x+Math.cos(a)*sp*d;p.y=b.y+Math.sin(a)*sp*d*.8-b.up*d+.5*b.grav*d*d;p.s=u<.35?2:1;}
   else if(b.kind==='dust'){const dir=h1<.5?-1:1,sp=b.spd*(.3+.7*h2);p.x=b.x+dir*sp*d*(1-u*.5);p.y=b.y-1-h3*5*eo(u);p.s=u<.5?2:1;}
   else{p.x=b.x+(h1-.5)*b.spd;p.y=b.y+(h2-.5)*b.spd*.7;p.s=1;p.k=(u<.7&&((Math.floor(d*16)+i)%3))?2:1;}
  }}
 for(const s of STREAMS){for(let i=0;i<s.n&&poolN<POOL.length;i++){
  const lt=s.t0+(s.t1-s.t0)*i/s.n,d=(t-lt)*K,fl=.4;if(d<0||d>fl)continue;const u=eio(d/fl);

let T=0,playing=false,started=false,last=null,idle=0,pv=0;
const [DITH,DTX]=mk(W,H);DTX.fillStyle=C.n0;for(let y=0;y<H;y++)for(let x=(y&1);x<W;x+=2)DTX.fillRect(x,y,1,1);
function audioInit(){
 if(AU.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 try{setupGraph(AU,new AC());}catch(e){AU.ctx=null;}}
function audioOK(){return AU.ctx&&AU.ctx.state==='running';}
function resync(){if(!AU.ctx)return;newBus(AU);AU.base=AU.ctx.currentTime-T;let lo=0,hi=SND.length;while(lo<hi){const m=(lo+hi)>>1;if(SND[m].rt<T-.001)lo=m+1;else hi=m;}AU.ptr=lo;}
function audioTick(){
 if(!AU.ctx||!playing||!audioOK())return;
 const now=AU.ctx.currentTime,horizon=T+.3;
 while(AU.ptr<SND.length&&SND[AU.ptr].rt<=horizon){const e=SND[AU.ptr++];if(e.rt<T-.08)continue;try{playEv(AU,e,Math.max(now,AU.base+e.rt));}catch(err){}}}
function blit(){vx.imageSmoothingEnabled=false;vx.drawImage(BUF,0,0,view.width,view.height);}
function drawStart(vt){
 render(30,vt+30*K);g=BX;g.drawImage(DITH,0,0);
 const bw=168,bh=58,x=rd((W-bw)/2),y=rd((H-bh)/2)-6;
 R(x+3,y+3,bw,bh,C.n0);rbox(x,y,bw,bh,C.n1,C.t2);R(x+2,y+2,bw-4,1,C.n3);
 const px=x+18,py=y+17,pulse=Math.floor(vt*2)%2;
 rbox(px-4,py-4,32,32,pulse?C.t1:C.t0,C.t3);
 for(let i=0;i<12;i++)R(px+8,py+2+i,Math.min(i,11-i)+1,1,C.n7);
 text('PULSA PARA',x+58,y+15,C.n7);text('EMPEZAR',x+58,y+23,C.n7);
 // altavoz
 const sx=x+58,sy=y+37;R(sx,sy+2,3,4,C.g2);R(sx+3,sy+1,1,6,C.g2);R(sx+4,sy,1,8,C.g2);P(sx+6,sy+2,C.g2);P(sx+6,sy+5,C.g2);P(sx+7,sy+3,C.g2);P(sx+7,sy+4,C.g2);P(sx+8,sy+1,C.g2);P(sx+8,sy+6,C.g2);P(sx+9,sy+2,C.g2);P(sx+9,sy+3,C.g2);P(sx+9,sy+4,C.g2);P(sx+9,sy+5,C.g2);
 text('CON SONIDO',x+72,y+39,C.g2);
 blit();}
function frame(now){
 if(last===null)last=now;const dt=Math.min(.1,(now-last)/1000);last=now;pv+=dt;
 if(!started){drawStart(pv);ui();requestAnimationFrame(frame);return;}
 if(playing){
  // el reloj de audio manda; si el navegador no deja sonar, se sigue en silencio
  if(audioOK()){if(AU.drift){AU.base=AU.ctx.currentTime-T;AU.drift=false;}T=AU.ctx.currentTime-AU.base;AU.stall=0;}
  else{AU.stall=(AU.stall||0)+dt;if(!AU.ctx||AU.stall>.35){T+=dt;AU.drift=true;}}
  if(T>=DUR){T=DUR;playing=false;setIcon();}}
 if(T>=DUR)idle+=dt;
 audioTick();
 const lat=audioOK()?(AU.ctx.outputLatency||AU.ctx.baseLatency||0):0;
 const Tv=Math.max(0,T<DUR?T-lat:T);
 render(Tv/K,T<DUR?Tv:DUR+idle);blit();ui();
 requestAnimationFrame(frame);}
const $=id=>document.getElementById(id);
function setIcon(){const ip=$('iPlay');const b=$('bPlay');
 if(playing){ip.innerHTML='<path fill="#9af3e4" d="M1 1h2v5H1zM4 1h2v5H4z"/>';b.title='Pausar (espacio)';b.setAttribute('aria-label','Pausar');}
 else if(T>=DUR){ip.innerHTML='<path fill="#f5d060" d="M1 1h4v1H1zM0 2h1v3H0zM1 5h4v1H1zM5 4h1v1H5zM4 3h3v1H4zM5 2h1v1H5z"/>';b.title='Repetir';b.setAttribute('aria-label','Repetir');}
 else{ip.innerHTML='<path fill="#9af3e4" d="M1 0h1v7H1zM2 1h1v5H2zM3 2h1v3H3zM4 3h1v1H4z"/>';b.title='Reproducir (espacio)';b.setAttribute('aria-label','Reproducir');}
 const mi=$('iMute');mi.innerHTML=AU.muted?'<path fill="#e2524f" d="M0 2h2v3H0zM2 1h1v5H2zM3 0h1v7H3zM5 2h1v1H5zM6 3h1v1H6zM5 4h1v1H5zM6 1h1v1H6zM6 5h1v1H6z"/>':'<path fill="#9af3e4" d="M0 2h2v3H0zM2 1h1v5H2zM3 0h1v7H3zM5 2h1v3H5zM6 1h1v5H6z"/>';
 $('bMute').setAttribute('aria-label',AU.muted?'Activar sonido':'Silenciar');$('bMute').title=AU.muted?'Activar sonido (M)':'Silenciar (M)';}
function begin(){audioInit();started=true;if(AU.ctx&&AU.ctx.state!=='running')AU.ctx.resume();restart();}
function play(){if(T>=DUR){restart();return;}playing=true;last=null;if(AU.ctx){AU.ctx.resume().then(()=>{AU.base=AU.ctx.currentTime-T;});AU.base=AU.ctx.currentTime-T;}setIcon();}
function pause(){playing=false;if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend();setIcon();}
function toggle(){if(!started){begin();return;}if(playing)pause();else play();}
function restart(){T=0;idle=0;playing=true;last=null;if(AU.ctx){AU.ctx.resume();resync();}setIcon();}
function seek(t){if(!started){begin();}T=clamp(t,0,DUR);idle=0;if(T>=DUR){T=DUR;playing=false;}resync();setIcon();}
function mute(){AU.muted=!AU.muted;if(AU.master)AU.master.gain.setTargetAtTime(AU.muted?0:VOL,AU.ctx.currentTime,.03);setIcon();}
function full(){const el=document.documentElement;if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}}
$('bPlay').onclick=toggle;$('bRestart').onclick=()=>{if(!started)begin();else restart();};$('bFull').onclick=full;$('bMute').onclick=mute;
$('bar').onclick=e=>{const r=$('bar').getBoundingClientRect();seek(clamp((e.clientX-r.left)/r.width,0,1)*DUR);};
view.onclick=toggle;view.ondblclick=full;
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();toggle();}else if(e.key==='r'||e.key==='R'){if(!started)begin();else restart();}else if(e.key==='f'||e.key==='F')full();else if(e.key==='m'||e.key==='M')mute();else if(e.key==='ArrowRight')seek(T+2);else if(e.key==='ArrowLeft')seek(T-2);});
let shown=performance.now();function poke(){shown=performance.now();}
addEventListener('mousemove',poke);addEventListener('touchstart',poke);addEventListener('keydown',poke);
function ui(){$('fill').style.width=(T/DUR*100)+'%';const on=started&&(!playing||performance.now()-shown<2200);$('ui').classList.toggle('on',on);}
setIcon();
// ayudas para pruebas: saltar a un instante (en unidades de historia) y renderizar el audio offline
window.__seek=(t,vt)=>{started=true;T=t*K;playing=false;render(t,vt===undefined?t*K:vt);blit();};
window.__renderAudio=async(sr,only)=>{sr=sr||22050;const oc=new OfflineAudioContext(1,Math.ceil(sr*(DUR+3.5)),sr);const A={muted:false};setupGraph(A,oc,oc.destination);for(const e of SND){if(only==='mus'&&!e.mus)continue;if(only==='sfx'&&e.mus)continue;if(only&&only[0]===':'&&!only.split(':').includes(e.f))continue;playEv(A,e,e.rt+.001);}const b=await oc.startRendering();return b.getChannelData(0);};
requestAnimationFrame(frame);
</script>
