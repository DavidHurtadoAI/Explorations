<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ruta de caza · Red Dead Redemption 2</title>
<meta name="description" content="Guía interactiva de caza de Red Dead Redemption 2: ruta desde Horseshoe Overlook para conseguir las 21 pieles perfectas del zurrón Leyenda del Este.">
<style>
:root{
  --bg:#100d09;
  --bg2:#171209;
  --panel:#1d1710;
  --panel2:#252017;
  --panel3:#2f2819;
  --line:#3d3325;
  --line2:#544631;
  --paper:#e6dcc0;
  --ink:#efe6cf;
  --muted:#a1937a;
  --muted2:#7d7059;
  --gold:#d9b56c;
  --gold2:#f0d495;
  --red:#b34a33;
  --green:#7f9a6b;

  --s1:#c96a3c;
  --s2:#d0a63a;
  --s3:#6f9c86;
  --s4:#5b8fb9;
  --s5:#9d6bb3;
  --s6:#a08157;

  --shadow:0 18px 45px rgba(0,0,0,.55);
  --font-d:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-b:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-b);font-size:14px;line-height:1.5;
  overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(217,181,108,.10), transparent 60%),
    radial-gradient(90% 70% at 10% 110%, rgba(179,74,51,.10), transparent 60%);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--panel)}
::-webkit-scrollbar-thumb:hover{background:var(--line2)}

/* ---------- LAYOUT ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-rows:auto 1fr;height:100%}

header.topbar{
  display:flex;align-items:center;gap:18px;
  padding:10px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:30;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .seal{
  width:40px;height:40px;flex:none;border-radius:50%;
  border:1.5px solid var(--gold);color:var(--gold);
  display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3a2f1d,#191309);
  box-shadow:inset 0 0 0 3px rgba(217,181,108,.14);
}
.brand h1{
  margin:0;font-family:var(--font-d);font-size:17px;letter-spacing:.10em;
  text-transform:uppercase;color:var(--gold2);white-space:nowrap;
}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.04em}

.topbar .spacer{flex:1}
.progress-wrap{display:flex;align-items:center;gap:12px}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-d);font-size:13px;color:var(--gold2);letter-spacing:.02em;
}
.progress-meta{font-size:11.5px;color:var(--muted);line-height:1.35;white-space:nowrap}
.progress-meta b{display:block;font-family:var(--font-d);font-size:13px;color:var(--ink);letter-spacing:.05em}

.iconbtn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--muted);display:grid;place-items:center;transition:.15s;
}
.iconbtn:hover{color:var(--gold2);border-color:var(--line2);background:var(--panel3)}

main{display:grid;grid-template-columns:376px 1fr;min-height:0}

/* ---------- SIDEBAR ---------- */
aside{
  border-right:1px solid var(--line);background:var(--panel);
  display:grid;grid-template-rows:auto 1fr;min-height:0;position:relative;z-index:20;
}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs button{
  flex:1;padding:11px 4px 9px;font-size:11px;letter-spacing:.10em;text-transform:uppercase;
  color:var(--muted2);border-bottom:2px solid transparent;font-family:var(--font-d);transition:.15s;
}
.tabs button:hover{color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--gold2);border-bottom-color:var(--gold);background:var(--panel)}
.panes{overflow:auto;padding:16px 16px 60px}
.pane{display:none;animation:fade .25s ease}
.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sect-title{
  font-family:var(--font-d);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted2);margin:22px 0 10px;display:flex;align-items:center;gap:10px;
}
.sect-title:first-child{margin-top:0}
.sect-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* stage cards */
.stage-card{
  border:1px solid var(--line);border-radius:10px;background:var(--panel2);
  margin-bottom:10px;overflow:hidden;transition:.18s;
}
.stage-card:hover{border-color:var(--line2)}
.stage-card.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset,0 8px 24px rgba(0,0,0,.35)}
.stage-head{display:flex;gap:12px;align-items:flex-start;padding:12px 13px;width:100%;text-align:left}
.stage-num{
  width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-d);font-size:14px;color:#140f08;background:var(--c);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent);
}
.stage-head h3{margin:0;font-family:var(--font-d);font-size:14.5px;letter-spacing:.02em;color:var(--ink);font-weight:600}
.stage-head .sub{font-size:11.5px;color:var(--muted2);margin-top:2px}
.stage-body{padding:0 13px 13px 53px;display:none}
.stage-card.active .stage-body{display:block}
.stage-body p{margin:0 0 10px;font-size:12.8px;color:var(--muted)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 6px;border-radius:999px;
  border:1px solid var(--line2);background:var(--panel3);font-size:11.5px;color:var(--ink);
  cursor:pointer;transition:.15s;
}
.chip:hover{border-color:var(--gold);color:var(--gold2)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.done{opacity:.45;text-decoration:line-through}

/* animal list */
.a-item{
  display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
  padding:9px 10px;border:1px solid transparent;border-radius:9px;cursor:pointer;transition:.15s;
}
.a-item:hover{background:var(--panel2);border-color:var(--line)}
.a-item.complete .a-name{color:var(--muted2);text-decoration:line-through}
.a-medal{
  width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1px solid var(--line2);background:radial-gradient(circle at 35% 30%,#39301f,#161108);color:var(--gold);
}
.a-name{display:block;font-family:var(--font-d);font-size:14.5px;letter-spacing:.01em}
.a-meta{display:block;font-size:11px;color:var(--muted2);margin-top:2px;line-height:1.35}
.a-count{
  font-family:var(--font-d);font-size:12px;color:var(--muted);
  border:1px solid var(--line);border-radius:7px;padding:3px 8px;background:var(--panel2);white-space:nowrap;
}
.a-count.full{color:#a7c48f;border-color:#4d5c3f;background:rgba(127,154,107,.12)}

/* checkboxes */
.pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.pip{
  width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);background:var(--panel3);
  display:grid;place-items:center;transition:.15s;color:transparent;
}
.pip:hover{border-color:var(--gold)}
.pip.on{background:linear-gradient(180deg,#7f9a6b,#5e7550);border-color:#8fae78;color:#12180d}

/* satchels */
.satchel{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:12px 13px;margin-bottom:10px}
.satchel.done{border-color:#4d5c3f;background:rgba(127,154,107,.08)}
.satchel h4{margin:0 0 3px;font-family:var(--font-d);font-size:14px;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.satchel .unlock{font-size:11px;color:var(--muted2);margin-bottom:9px}
.satchel .unlock b{color:var(--muted);font-weight:600}
.recipe{display:flex;flex-wrap:wrap;gap:5px}
.rq{
  font-size:11.5px;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);
  background:var(--panel3);color:var(--muted);cursor:pointer;
}
.rq.ok{color:#b3ce9b;border-color:#4d5c3f;background:rgba(127,154,107,.14)}
.rq:hover{border-color:var(--gold);color:var(--gold2)}
.legend-satchel{border-color:var(--gold);background:linear-gradient(180deg,rgba(217,181,108,.10),rgba(217,181,108,.03))}
.legend-satchel h4{color:var(--gold2)}

/* prose */
.prose p{margin:0 0 11px;font-size:13px;color:var(--muted)}
.prose strong{color:var(--ink);font-weight:600}
.prose ul{margin:0 0 14px;padding-left:18px}
.prose li{font-size:13px;color:var(--muted);margin-bottom:7px}
.prose li::marker{color:var(--gold)}
.callout{
  border-left:2px solid var(--gold);background:linear-gradient(90deg,rgba(217,181,108,.09),transparent);
  padding:11px 13px;border-radius:0 8px 8px 0;margin:0 0 14px;
}
.callout p{margin:0;font-size:12.8px;color:var(--ink)}
.callout .lab{
  font-family:var(--font-d);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);display:block;margin-bottom:4px;
}
.kit{display:grid;gap:8px}
.kit-item{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.kit-item svg{flex:none;color:var(--gold);margin-top:1px}
.kit-item b{display:block;font-family:var(--font-d);font-size:13.5px;color:var(--ink);font-weight:600}
.kit-item span{font-size:12px;color:var(--muted2)}

/* ---------- MAP ---------- */
.mapwrap{position:relative;overflow:hidden;background:
  radial-gradient(80% 80% at 50% 40%, #191308, #0d0a06 75%);}
#viewport{position:absolute;inset:0;cursor:grab;touch-action:none}
#viewport.grabbing{cursor:grabbing}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#canvas img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;
  filter:sepia(.12) saturate(.92) contrast(1.04) brightness(.98);}
#routes{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#markers{position:absolute;inset:0}

.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.mk .inner{transform:scale(var(--inv,1));transform-origin:center;pointer-events:auto;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:opacity .25s}
.mk.dim .inner{opacity:.18}
.mk.hidden{display:none}

.pin{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 34% 28%,#2c2416,#0f0b06);
  border:1.5px solid var(--c,#d9b56c);color:var(--c,#d9b56c);
  box-shadow:0 4px 12px rgba(0,0,0,.6),0 0 0 3px color-mix(in srgb,var(--c,#d9b56c) 16%,transparent);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s;
}
.pin:hover{transform:scale(1.18)}
.mk.sel .pin{transform:scale(1.25);box-shadow:0 6px 18px rgba(0,0,0,.7),0 0 0 5px color-mix(in srgb,var(--c,#d9b56c) 34%,transparent)}
.pin.way{
  width:26px;height:26px;font-family:var(--font-d);font-size:13px;
  background:var(--c);color:#150f07;border-color:#0f0b06;
}
.pin.done{border-color:#7f9a6b;color:#a7c48f}
.pin.done::after{
  content:"";position:absolute;width:12px;height:12px;border-radius:50%;
  background:#7f9a6b;border:1.5px solid #0f0b06;transform:translate(11px,-11px);
}
.tag{
  font-family:var(--font-d);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;white-space:nowrap;cursor:pointer;
  background:rgba(14,10,6,.86);border:1px solid var(--line2);color:var(--ink);
  box-shadow:0 3px 8px rgba(0,0,0,.5);
}
.mk.way-mk .tag{color:var(--c);border-color:color-mix(in srgb,var(--c) 45%,var(--line2))}
body.nolabels .tag{display:none}
#markers.hide-way .mk.way-mk .tag{display:none}
#markers.hide-animal .mk.animal-mk .tag{display:none}
#markers .mk.sel .tag,
#markers .mk.stage-on .tag,
#markers .inner:hover .tag{display:block !important}
body.nolabels #markers .tag{display:none !important}
.mk .inner:hover{z-index:5}

/* map ui */
.map-ui{position:absolute;z-index:12;display:flex;gap:8px}
.map-ui.tl{top:14px;left:14px;flex-wrap:wrap;max-width:calc(100% - 28px)}
.map-ui.br{bottom:14px;right:14px;flex-direction:column}
.map-ui.bl{bottom:14px;left:14px;flex-direction:column;gap:10px;align-items:flex-start}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--line);background:rgba(20,16,10,.86);backdrop-filter:blur(8px);
  font-size:11.5px;letter-spacing:.04em;color:var(--muted);transition:.15s;
}
.pill:hover{border-color:var(--line2);color:var(--ink)}
.pill.on{border-color:var(--c,var(--gold));color:var(--gold2);background:rgba(36,27,14,.94);box-shadow:0 0 0 1px color-mix(in srgb,var(--c,var(--gold)) 28%,transparent) inset}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--gold))}
.zoombtn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--line);
  background:rgba(20,16,10,.86);backdrop-filter:blur(8px);color:var(--muted);
  display:grid;place-items:center;transition:.15s;
}
.zoombtn:hover{color:var(--gold2);border-color:var(--line2)}

.legend{
  border:1px solid var(--line);background:rgba(16,12,8,.88);backdrop-filter:blur(8px);
  border-radius:10px;padding:10px 12px;font-size:11px;color:var(--muted2);max-width:210px;
}
.legend .t{font-family:var(--font-d);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.legend .row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.legend .row:last-child{margin-bottom:0}
.legend .sign{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);
  font-family:var(--font-d);font-size:10px;letter-spacing:.10em;color:var(--muted2);font-style:italic}
.legend .sign b{color:var(--gold);font-weight:400;font-style:normal;letter-spacing:.14em}
.legend i{width:16px;height:2px;border-radius:2px;background:var(--c);display:block;flex:none}

/* step navigator */
.stepnav{
  position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:12;
  display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;
  border:1px solid var(--line);background:rgba(16,12,8,.9);backdrop-filter:blur(10px);
  box-shadow:var(--shadow);
}
.stepnav button.nav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.stepnav button.nav:hover{color:var(--gold2);background:var(--panel3)}
.stepnav .steps{display:flex;gap:3px;padding:0 5px}
.stepnav .steps b{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  font-family:var(--font-d);font-size:12px;font-weight:500;color:var(--muted2);
  border:1px solid transparent;transition:.15s;
}
.stepnav .steps b:hover{color:var(--ink)}
.stepnav .steps b.on{background:var(--c);color:#140f07;border-color:#0f0b06}

/* detail drawer */
.drawer{
  position:absolute;top:14px;right:14px;width:320px;max-height:calc(100% - 28px);z-index:25;
  border:1px solid var(--line2);border-radius:12px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:var(--shadow);
  display:none;flex-direction:column;
}
.drawer.on{display:flex;animation:slidein .22s cubic-bezier(.2,.8,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.drawer-head{padding:14px 15px 12px;border-bottom:1px solid var(--line);position:relative;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c,#d9b56c) 16%,transparent),transparent)}
.drawer-head .eyebrow{font-family:var(--font-d);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--c,var(--gold))}
.drawer-head h3{margin:3px 0 0;font-family:var(--font-d);font-size:20px;letter-spacing:.02em}
.drawer-close{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:7px;color:var(--muted2)}
.drawer-close:hover{color:var(--ink);background:var(--panel3)}
.drawer-body{padding:13px 15px 16px;overflow:auto}
.kv{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;margin-bottom:12px}
.kv dt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);padding-top:2px}
.kv dd{margin:0;font-size:12.8px;color:var(--ink)}
.drawer-body p{margin:0 0 10px;font-size:12.8px;color:var(--muted)}
.badge{
  display:inline-block;font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line2);background:var(--panel3);color:var(--muted);margin:0 4px 4px 0;
}
.badge.g{color:#b3ce9b;border-color:#4d5c3f}
.badge.r{color:#e0a08e;border-color:#6b3d31}

/* toast */
.toast{
  position:absolute;left:50%;top:16px;transform:translate(-50%,-16px);z-index:40;
  padding:9px 16px;border-radius:999px;border:1px solid var(--gold);
  background:rgba(24,18,10,.94);color:var(--gold2);font-size:12.5px;letter-spacing:.03em;
  opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--shadow);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.hint{position:absolute;bottom:14px;right:64px;z-index:11;font-size:10.5px;color:var(--muted2);letter-spacing:.05em}

/* mobile */
.mobtabs{display:none}
@media (max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .map-ui.tl{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    width:calc(100% - 28px);padding-bottom:4px;scrollbar-width:none}
  .map-ui.tl::-webkit-scrollbar{display:none}
  .map-ui.tl .pill{flex:none}
  .map-ui.br{bottom:auto;top:100px;right:12px;flex-direction:column}
  .zoombtn{width:34px;height:34px}
  aside{
    border-right:0;border-top:1px solid var(--line);
    position:absolute;left:0;right:0;bottom:0;height:56%;z-index:40;
    transform:translateY(calc(100% - 42px));transition:transform .3s cubic-bezier(.2,.8,.3,1);
    border-radius:14px 14px 0 0;box-shadow:0 -18px 40px rgba(0,0,0,.6);
  }
  body.sheet-open aside{transform:translateY(0)}
  .sheet-handle{display:flex !important}
  .mapwrap{grid-row:1/-1;grid-column:1}
  .drawer{width:auto;left:12px;right:12px;top:auto;bottom:100px;max-height:54%}
  .stepnav{bottom:54px;left:50%;transform:translateX(-50%)}
  .map-ui.bl{display:none}
  .hint{display:none}
  .brand p{display:none}
  .brand h1{font-size:14px}
  .panes{padding-bottom:80px}
}
@media (max-width:520px){
  .ring{display:none}
  .progress-meta{white-space:nowrap;font-size:10.5px}
  .progress-meta b{font-size:12px}
  header.topbar{padding:8px 12px;gap:10px}
  .brand .seal{width:34px;height:34px}
}
.sheet-handle{
  display:none;align-items:center;justify-content:center;gap:8px;height:42px;
  border-bottom:1px solid var(--line);background:var(--panel2);
  font-family:var(--font-d);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">

   ====================================================================== */
const AR = 12000/8670;
const BASE_W = 2000, BASE_H = BASE_W/AR;
const viewport = document.getElementById("viewport");
const canvas   = document.getElementById("canvas");
const markersEl= document.getElementById("markers");
const routesEl = document.getElementById("routes");

canvas.style.width  = BASE_W+"px";
canvas.style.height = BASE_H+"px";

let view = {x:0, y:0, k:1};
let MINK = .2, MAXK = 5;

function clampView(){
  const r = viewport.getBoundingClientRect();
  const w = BASE_W*view.k, h = BASE_H*view.k;
  const padX = Math.min(r.width*0.5, w*0.5);
  const padY = Math.min(r.height*0.5, h*0.5);
  view.x = Math.min(r.width - padX, Math.max(padX - w, view.x));
  view.y = Math.min(r.height - padY, Math.max(padY - h, view.y));
}
function apply(){
  clampView();
  canvas.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  markersEl.style.setProperty("--inv", 1/view.k);
  markersEl.classList.toggle("hide-way",    view.k < fitK*1.10);
  markersEl.classList.toggle("hide-animal", view.k < fitK*1.70);
}
const LAND_FULL   = {x0:1.5,  y0:5.5, x1:90.5, y1:96.5};
const LAND_NARROW = {x0:33.0, y0:6.0, x1:91.0, y1:97.0};
let fitK = 1;
function fit(animate){
  const r = viewport.getBoundingClientRect();
  const LAND = r.width < 780 ? LAND_NARROW : LAND_FULL;
  const w = BASE_W*(LAND.x1-LAND.x0)/100, h = BASE_H*(LAND.y1-LAND.y0)/100;
  const k = Math.min(r.width/w, r.height/h)*0.98;
  fitK = k; MINK = k*0.7;
  const cx = (LAND.x0+LAND.x1)/2/100*BASE_W, cy = (LAND.y0+LAND.y1)/2/100*BASE_H;
  animateTo({k, x:r.width/2-cx*k, y:r.height/2-cy*k}, animate!==false);
}
function flyTo(xPct, yPct, k, animate){
  const r = viewport.getBoundingClientRect();
  const target = Math.max(MINK, Math.min(MAXK, k||view.k));
  animateTo({
    k:target,
    x:r.width/2  - (xPct/100)*BASE_W*target,
    y:r.height/2 - (yPct/100)*BASE_H*target
  }, animate!==false);
}
let animId = null;
function animateTo(to, animate){
  if(animId) cancelAnimationFrame(animId);
  if(!animate){ view = {...to}; apply(); return; }
  const from = {...view}, t0 = performance.now(), dur = 620;
  const ease = t => 1 - Math.pow(1-t, 3);
  (function step(now){
    const t = Math.min(1,(now-t0)/dur), e = ease(t);
    view.k = from.k + (to.k-from.k)*e;
    view.x = from.x + (to.x-from.x)*e;
    view.y = from.y + (to.y-from.y)*e;
    apply();
    if(t<1) animId = requestAnimationFrame(step);
  })(t0);
}

/* pan */
let drag = null;
viewport.addEventListener("pointerdown", e=>{
  if(e.target.closest(".pin, .tag")) return;
  drag = {id:e.pointerId, x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, moved:0};
  viewport.setPointerCapture(e.pointerId);
  viewport.classList.add("grabbing");
  if(animId) cancelAnimationFrame(animId);
});
viewport.addEventListener("pointermove", e=>{
  if(!drag || e.pointerId!==drag.id) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  drag.moved = Math.max(drag.moved, Math.abs(dx)+Math.abs(dy));
  view.x = drag.vx+dx; view.y = drag.vy+dy; apply();
});
["pointerup","pointercancel"].forEach(ev=>viewport.addEventListener(ev, e=>{
  if(drag && e.pointerId===drag.id){ drag=null; viewport.classList.remove("grabbing"); }
}));

/* pellizco */
let pinch = null;
viewport.addEventListener("touchstart", e=>{
  if(e.touches.length===2){
    drag=null;
    const [a,b]=e.touches;
    pinch = {d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY), k:view.k,
             cx:(a.clientX+b.clientX)/2, cy:(a.clientY+b.clientY)/2, x:view.x, y:view.y};
  }
},{passive:true});
viewport.addEventListener("touchmove", e=>{
  if(pinch && e.touches.length===2){
    e.preventDefault();
    const [a,b]=e.touches;
    const d = Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const nk = Math.max(MINK, Math.min(MAXK, pinch.k*(d/pinch.d)));
    const r = viewport.getBoundingClientRect();
    const px = pinch.cx-r.left, py = pinch.cy-r.top;
    view.x = px - (px-pinch.x)*(nk/pinch.k);
    view.y = py - (py-pinch.y)*(nk/pinch.k);
    view.k = nk; apply();
  }
},{passive:false});
viewport.addEventListener("touchend", ()=>{ pinch=null; });

/* rueda */
viewport.addEventListener("wheel", e=>{
  e.preventDefault();
  if(animId) cancelAnimationFrame(animId);
  const r = viewport.getBoundingClientRect();
  const px = e.clientX-r.left, py = e.clientY-r.top;
  const factor = Math.exp(-e.deltaY*0.0016);
  const nk = Math.max(MINK, Math.min(MAXK, view.k*factor));
  view.x = px-(px-view.x)*(nk/view.k);
  view.y = py-(py-view.y)*(nk/view.k);
  view.k = nk; apply();
},{passive:false});

viewport.addEventListener("dblclick", e=>{
  const r = viewport.getBoundingClientRect();
  const px = e.clientX-r.left, py = e.clientY-r.top;
  const nk = Math.min(MAXK, view.k*1.9);
  animateTo({k:nk, x:px-(px-view.x)*(nk/view.k), y:py-(py-view.y)*(nk/view.k)}, true);
});

function zoomBy(f){
  const r = viewport.getBoundingClientRect();
  const px = r.width/2, py = r.height/2;
  const nk = Math.max(MINK, Math.min(MAXK, view.k*f));
  animateTo({k:nk, x:px-(px-view.x)*(nk/view.k), y:py-(py-view.y)*(nk/view.k)}, true);
}

/* ======================================================================
   RUTA (SVG)
   ====================================================================== */
function catmull(points, tension){
  if(points.length<2) return "";
  const t = tension==null?0.5:tension;
  let d = `M ${points[0][0]} ${points[0][1]}`;
  for(let i=0;i<points.length-1;i++){
    const p0 = points[i-1]||points[i], p1 = points[i], p2 = points[i+1], p3 = points[i+2]||points[i+1];
    const c1x = p1[0]+(p2[0]-p0[0])/6*t, c1y = p1[1]+(p2[1]-p0[1])/6*t;
    const c2x = p2[0]-(p3[0]-p1[0])/6*t, c2y = p2[1]-(p3[1]-p1[1])/6*t;
    d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2[0]} ${p2[1]}`;
  }
  return d;
}
function buildRoutes(){
  const NS = "http://www.w3.org/2000/svg";
  routesEl.innerHTML = "";
  const defs = document.createElementNS(NS,"defs");
  defs.innerHTML = `<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  routesEl.appendChild(defs);

  /* enlace entre etapas: línea tenue continua */
  const all = [];
  STAGES.forEach(s=>s.way.forEach(w=>all.push([w.x,w.y])));
  const linkPath = document.createElementNS(NS,"path");
  linkPath.setAttribute("d", catmull(all));
  linkPath.setAttribute("fill","none");
  linkPath.setAttribute("stroke","rgba(230,220,192,.28)");
  linkPath.setAttribute("stroke-width","1.6");
  linkPath.setAttribute("stroke-dasharray","0.5 3.5");
  linkPath.setAttribute("stroke-linecap","round");
  linkPath.setAttribute("vector-effect","non-scaling-stroke");
  linkPath.dataset.role = "link";
  routesEl.appendChild(linkPath);

  STAGES.forEach((s,i)=>{
    const pts = s.way.map(w=>[w.x,w.y]);
    if(i<STAGES.length-1 && STAGES[i+1].way.length) pts.push([STAGES[i+1].way[0].x, STAGES[i+1].way[0].y]);
    if(pts.length<2) return;
    const d = catmull(pts);

    const halo = document.createElementNS(NS,"path");
    halo.setAttribute("d",d); halo.setAttribute("fill","none");
    halo.setAttribute("stroke",s.hex); halo.setAttribute("stroke-opacity",".22");
    halo.setAttribute("stroke-width","11"); halo.setAttribute("stroke-linecap","round");
    halo.setAttribute("vector-effect","non-scaling-stroke");
    halo.dataset.stage = s.id; halo.dataset.role="halo";
    routesEl.appendChild(halo);

    const p = document.createElementNS(NS,"path");
    p.setAttribute("d",d); p.setAttribute("fill","none");
    p.setAttribute("stroke",s.hex); p.setAttribute("stroke-width","3.1");
    p.setAttribute("stroke-linecap","round"); p.setAttribute("stroke-dasharray","7 5");
    p.setAttribute("vector-effect","non-scaling-stroke");
    p.setAttribute("filter","url(#glow)");
    p.dataset.stage = s.id; p.dataset.role="line";
    p.style.animation = "none";
    routesEl.appendChild(p);
  });

  const style = document.createElementNS(NS,"style");
  style.textContent = `@keyframes march{to{stroke-dashoffset:-24}}
    #routes path[data-role="line"]{animation:march 1.6s linear infinite}`;
  routesEl.appendChild(style);
}

}

        </div>`;
      el.querySelector(".inner").addEventListener("click", ev=>{
        ev.stopPropagation(); openWay(s, w);
      });
      markersEl.appendChild(el);
    });

  ORDER.forEach(key=>{
    const a = ANIMALS[key];
    (a.spots||[]).forEach((sp,i)=>{
      const st = STAGES.find(s=>s.id===sp.st) || STAGES.find(s=>s.animals.includes(key));
      const hex = st ? st.hex : "#d9b56c";
      const el = document.createElement("div");
      el.className = "mk animal-mk";
      el.style.left = sp.x+"%"; el.style.top = sp.y+"%";
      el.style.setProperty("--c", hex);
      el.dataset.stage = st ? st.id : 0;
      el.dataset.type = "animal";
      el.dataset.key = key;
      el.innerHTML = `<div class="inner">
          <div class="pin" title="${a.nombre} · ${sp.l}">${medal(a.icon,17)}</div>
          <div class="tag">${a.nombre}${a.need>1?" ×"+a.need:""}</div>
        </div>`;
      el.querySelector(".inner").addEventListener("click", ev=>{
        ev.stopPropagation(); openAnimal(key);
      });
      markersEl.appendChild(el);
    });
  });
  refreshMarkers();
}

function refreshMarkers(){
  markersEl.querySelectorAll(".mk").forEach(el=>{
    const st = +el.dataset.stage;
    const dim = activeStage!==0 && st!==activeStage;
    el.classList.toggle("dim", dim);
    el.classList.toggle("stage-on", activeStage!==0 && st===activeStage);

    let hide = false;
    if(el.dataset.type==="animal"){
      const k = el.dataset.key;
      el.querySelector(".pin").classList.toggle("done", isDone(k));
      if(onlyPending && isDone(k)) hide = true;
      el.classList.toggle("sel", selected && selected.type==="animal" && selected.key===k);
    }else{
      el.classList.toggle("sel", selected && selected.type==="way" && selected.key===el.dataset.key);
    }
    el.classList.toggle("hidden", hide);
  });
  routesEl.querySelectorAll("path[data-stage]").forEach(p=>{
    const on = activeStage===0 || +p.dataset.stage===activeStage;
    p.style.opacity = on ? 1 : .12;
  });
  const link = routesEl.querySelector('path[data-role="link"]');
  if(link) link.style.opacity = activeStage===0 ? 1 : .1;
}

/* ======================================================================
   PANEL DE DETALLE

const drawer = document.getElementById("drawer");
document.getElementById("drClose").onclick = closeDrawer;
function closeDrawer(){ drawer.classList.remove("on"); selected=null; refreshMarkers(); }

function openAnimal(key, fly){
  const a = ANIMALS[key];
  const st = STAGES.find(s=>s.animals.includes(key));
  selected = {type:"animal", key};
  drawer.classList.add("on");
  drawer.style.setProperty("--c", st?st.hex:"#d9b56c");
  document.getElementById("drawerHead").style.setProperty("--c", st?st.hex:"#d9b56c");
  document.getElementById("drEyebrow").textContent = st ? "Etapa "+st.id+" · "+st.sub : "Objetivo";
  document.getElementById("drTitle").textContent = a.nombre + (a.need>1 ? "  ×"+a.need : "");

  const pips = Array.from({length:a.need},(_,i)=>
    `<button class="pip ${i<got[key]?"on":""}" data-k="${key}" data-i="${i}" title="Piel ${i+1}">
       <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4.5 4.5L19 7"/></svg>
     </button>`).join("");

  document.getElementById("drBody").innerHTML = `
    <div style="margin-bottom:12px">
      <span class="badge">${a.size}</span>
      <span class="badge">${a.momento}</span>
      <span class="badge ${isDone(key)?"g":"r"}">${Math.min(got[key],a.need)} / ${a.need} ${a.need>1?"conseguidas":"conseguida"}</span>
    </div>
    <dl class="kv">
      <dt>Arma</dt><dd>${a.arma}</dd>
      <dt>Dónde</dt><dd>${a.donde}</dd>
      <dt>Zurrón</dt><dd>${a.zurrones.join(" · ")}</dd>
    </dl>
    <p>${a.tip}</p>
    <div class="sect-title">Pieles perfectas</div>
    <div class="pips">${pips}</div>
    ${(a.spots&&a.spots.length>1)?`<div class="sect-title">Puntos en el mapa</div>
      <div class="chip-row">${a.spots.map(s=>`<button class="chip" data-fx="${s.x}" data-fy="${s.y}"><span class="dot" style="background:${st?st.hex:'#d9b56c'}"></span>${s.l}</button>`).join("")}</div>`:""}
  `;
  wirePips();
  document.getElementById("drBody").querySelectorAll("[data-fx]").forEach(b=>{
    b.onclick = ()=>flyTo(+b.dataset.fx, +b.dataset.fy, Math.max(view.k,1.5));
  });

  if(fly!==false && a.spots && a.spots.length) flyTo(a.spots[0].x, a.spots[0].y, Math.max(view.k, 1.35));
  refreshMarkers();
}

function openWay(s, w){
  selected = {type:"way", key:s.id+"-"+s.way.indexOf(w)};
  drawer.classList.add("on");
  document.getElementById("drawerHead").style.setProperty("--c", s.hex);
  document.getElementById("drEyebrow").textContent = "Etapa "+s.id;
  document.getElementById("drTitle").textContent = w.n;
  document.getElementById("drBody").innerHTML = `
    <p>${w.note}</p>
    <div class="sect-title">Objetivos de la etapa</div>
    <div class="chip-row">${s.animals.map(k=>{
      const a = ANIMALS[k];
      return `<button class="chip ${isDone(k)?"done":""}" data-a="${k}"><span class="dot" style="background:${s.hex}"></span>${a.nombre}${a.need>1?" ×"+a.need:""}</button>`;
    }).join("") || '<span style="font-size:12px;color:var(--muted2)">Sin caza. Aquí se entregan las pieles.</span>'}</div>
    <div class="sect-title">La etapa</div>
    <p>${s.text}</p>`;
  document.getElementById("drBody").querySelectorAll("[data-a]").forEach(b=>{
    b.onclick = ()=>openAnimal(b.dataset.a);
  });
  refreshMarkers();
}

function wirePips(){
  document.querySelectorAll(".pip").forEach(p=>{
    p.onclick = ()=>{
      const k = p.dataset.k, i = +p.dataset.i;
      got[k] = (got[k] === i+1) ? i : i+1;
      save(); renderAll();
      if(selected && selected.type==="animal" && selected.key===k) openAnimal(k, false);
      if(isDone(k)) toast(ANIMALS[k].nombre+": piel perfecta conseguida");
      if(total()===TOTAL) toast("Las 21 pieles. Ve a por el Leyenda del Este.");
    };
  });
}

/* ======================================================================
   ETAPAS
   ====================================================================== */
function setStage(id){
  activeStage = id;
  renderRuta(); renderFilters(); renderSteps(); refreshMarkers();
  if(id===0){ fit(); return; }
  const s = STAGES.find(x=>x.id===id);
  const xs = s.way.map(w=>w.x), ys = s.way.map(w=>w.y);
  const cx = (Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
  const spanX = Math.max(8, Math.max(...xs)-Math.min(...xs)+16);
  const spanY = Math.max(8, Math.max(...ys)-Math.min(...ys)+16);
  const r = viewport.getBoundingClientRect();
  const k = Math.min(r.width/(BASE_W*spanX/100), r.height/(BASE_H*spanY/100));
  flyTo(cx, cy, Math.max(MINK, Math.min(MAXK, k)));
  const card = document.querySelector(`.stage-card[data-stage="${id}"]`);
  if(card) card.scrollIntoView({behavior:"smooth", block:"nearest"});
}
document.getElementById("stepPrev").onclick = ()=>setStage(activeStage<=1 ? STAGES.length : activeStage-1);
document.getElementById("stepNext").onclick = ()=>setStage(activeStage>=STAGES.length ? 1 : activeStage+1);

/* ======================================================================
   PESTAÑAS, TOAST, ATAJOS
   ====================================================================== */
document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected", x===b));
    document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on", p.id==="pane-"+b.dataset.tab));
    document.body.classList.add("sheet-open");
  };
});
document.getElementById("sheetHandle").onclick = ()=>document.body.classList.toggle("sheet-open");

let toastT = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("on"), 2400);
}

document.getElementById("btnReset").onclick = ()=>{
  if(!confirm("¿Reiniciar el progreso de las 21 pieles?")) return;
  ORDER.forEach(k=>got[k]=0); save(); renderAll(); closeDrawer(); toast("Progreso reiniciado");
};

document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea")) return;
  if(e.key==="Escape") closeDrawer();
  else if(e.key>="1" && e.key<="6") setStage(+e.key);
  else if(e.key==="0") { setStage(0); }
  else if(e.key==="+"||e.key==="=") zoomBy(1.4);
  else if(e.key==="-") zoomBy(1/1.4);
  else if(e.key.toLowerCase()==="l") document.getElementById("zLbl").click();
  else if(e.key==="ArrowRight") document.getElementById("stepNext").click();
  else if(e.key==="ArrowLeft") document.getElementById("stepPrev").click();
});

viewport.addEventListener("click", e=>{
  if(!e.target.closest(".pin,.tag") && drag===null) { /* click en vacío: no cierra, es cómodo */ }
});

/* ======================================================================
   ARRANQUE
   ====================================================================== */
buildRoutes();
buildMarkers();
renderConsejos();
renderLegend();
renderAll();

const img = document.getElementById("mapimg");
function boot(){ fit(false); apply(); }
if(img.complete) boot(); else img.addEventListener("load", boot);
window.addEventListener("load", ()=>{ if(view.k===1) boot(); });
</script>
